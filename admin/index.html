<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración · JER</title><link rel="icon" href="../assets/sello-jer.jpeg"><link rel="stylesheet" href="../styles.css?v=7"><link rel="stylesheet" href="admin.css?v=8"></head><body class="admin-body">
<header class="admin-header"><a class="brand" href="../"><svg class="brand-logo" viewBox="430 293 1059 488" role="img" aria-label="JER" xmlns="http://www.w3.org/2000/svg"><image href="../assets/logo-jer-color.png" width="1920" height="1080"/></svg><span>PASAPORTE<strong>DEL CONOCIMIENTO</strong></span></a><a class="back-link" href="../">← Volver al pasaporte</a></header>
<main class="admin-main">
<section class="admin-card login-card" id="login">
<h1>Administrar el Pasaporte</h1>
<p>Ingresa con tu cuenta autorizada de Formación y Crecimiento.</p>
<form id="login-form">
<label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required>
<button class="primary">Iniciar sesión</button>
</form>
</section>
<section class="admin-card" id="dashboard" hidden>
<div class="dashboard-heading"><h1>Actualizar la base de datos</h1><button type="button" class="secondary" id="logout">Cerrar sesión</button></div>
<form id="import-form">
<label for="kind">Tipo de archivo</label>
<select id="kind"><option value="catalog">Capacitaciones e insignias</option><option value="approvals">Personas y cursos aprobados</option></select>
<p id="format"></p>
<label for="excel">Archivo Excel (.xlsx)</label><input id="excel" type="file" accept=".xlsx" required>
<button class="primary">Revisar archivo</button>
</form>
<section id="preview" hidden><h2>Vista previa</h2><dl id="summary"></dl>
<button type="button" class="primary" id="publish">Publicar cambios</button></section>
</section>
<p class="admin-card" id="status" role="status" aria-live="polite"></p>
</main>
<script src="../assets/vendor/xlsx.full.min.js" defer></script>
<script src="supabase-import.js" defer></script>
</body></html>
